# Netlify hosts the React frontend on its CDN.
#
# IMPORTANT: the backend does NOT run here. It's a Python/FastAPI service that
# holds ~350MB of fastText vectors in memory, which is far beyond what Netlify
# Functions allow (short timeouts, small bundles, no persistent process). The
# frontend talks to a backend hosted elsewhere via VITE_API_URL — set that in
# Netlify's UI under Site settings -> Environment variables, e.g.
#   VITE_API_URL = https://amtza-api.onrender.com
# (no trailing slash). Rebuild after changing it: Vite inlines env vars at build
# time, so a redeploy is required for a new value to take effect.

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# Single-page app: every route serves index.html so client-side routing works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the fingerprinted bundles, never cache the HTML shell. Without this
# a returning player can get a stale index.html that points at an asset filename
# the last deploy removed — a blank page rather than an old version.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Crawler-facing files change rarely but must not go stale for a day.
[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nothing here needs a camera, a microphone or a location.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
