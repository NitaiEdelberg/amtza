      <main style="max-width: 42rem; margin: 0 auto; padding: 2rem; color: #e8eaf6; font-family: sans-serif;">
        <h1>אמצע — משחק מילים שיתופי</h1>
        <p>
          אמצע הוא משחק מילים חינמי בעברית ובאנגלית. המשחק מציג שתי מילים, ואתם
          מנסים לכתוב את המילה שנמצאת באמצע ביניהן מבחינת המשמעות. במקביל, גם
          המחשב בוחר מילה. שתי הבחירות נחשפות יחד, הופכות לזוג המילים הבא, וכך
          ממשיכים עד שאתם והמחשב מגיעים לאותה מילה.
        </p>
        <h2>איך משחקים</h2>
        <ol>
          <li>מקבלים זוג מילים, למשל שמש וירח.</li>
          <li>כותבים מילה שלדעתכם נמצאת באמצע.</li>
          <li>המחשב בוחר במקביל, ואי אפשר לראות את הבחירה שלו מראש.</li>
          <li>הניחוש שלכם והניחוש של המחשב הופכים לזוג החדש.</li>
          <li>מנצחים כששניכם מגיעים לאותה מילה.</li>
        </ol>
        <h2>Amtza — a cooperative word game</h2>
        <p>
          Amtza (Hebrew for "middle") is a free browser word game in Hebrew and
          English. You are shown two words and type the word you think sits
          semantically between them. The computer picks its own middle word at the
          same time; both are revealed together and become the next pair. You win
          when the two of you land on the same word.
        </p>
        <p>המשחק דורש JavaScript. אנא הפעילו אותו כדי לשחק. / This game requires JavaScript.</p>
