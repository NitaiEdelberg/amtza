# Keep the free Render instance awake during the hours people actually play.
#
# A free Render service sleeps after 15 minutes with no traffic. Waking this one
# costs a container boot *plus* a model load — the minute-long "loading" screen
# this repo works so hard elsewhere to avoid. A cheap GET every ten minutes keeps
# it resident.
#
# ── THE BUDGET IS ACCOUNT-WIDE, NOT PER SERVICE ──────────────────────────────
# Render gives 750 free instance-hours a month across EVERY free service in the
# workspace, and when they run out it suspends ALL of them until the 1st. This
# file used to claim a 17h/day window (~520h) "stays well inside the budget",
# which is true only if this is the sole service. It is not. Adding up what the
# three keep-alives in three separate repos were each claiming in isolation:
#
#     amtza-api           18h/day    540h        <- this file
#     nitaiswebsite       13h/day    390h
#     jailbreak-backend   13h/day    390h
#                                   ------
#                                   1320h  against a 750h budget (1.8x over)
#
# Nothing broke only because GitHub was silently dropping most of the runs (the
# observed interval was ~2h, not 10 min). Making the cron reliable without also
# fixing this would have suspended the whole portfolio around day 17 of a month.
#
# Current allocation, ~540h total, leaving ~210h for organic traffic:
#     amtza-api           10h/day    300h        <- this file, the biggest slice
#     nitaiswebsite        4h/day    120h
#     jailbreak-backend    4h/day    120h
#
# amtza gets the most because its cold start is the worst: with no
# PREBUILT_CACHE_URL set it re-streams and re-parses ~670MB of vectors, which is
# minutes rather than the ~50s the others pay. Publishing that cache (see
# README → Deployment) drops it to ~2s, at which point this window can shrink
# and hand its hours back.
#
# GitHub's cron is best-effort and drops runs under load, which is worst at the
# top of the hour — hence the :03 offset rather than */10. A missed ping costs
# one visitor a wake-up, not a broken service.
name: keep-alive

on:
  schedule:
    - cron: "3-59/10 6-15 * * *" # UTC — 09:00-19:00 Israel time
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: |
          # --max-time is generous on purpose: if the instance did fall asleep,
          # this request is the one paying for the wake-up, and we want it to
          # stay connected long enough to finish rather than hand the cost to a
          # real player.
          curl --fail --silent --show-error --max-time 180 \
            "${API_URL%/}/health" | tee /dev/stderr
        env:
          API_URL: ${{ vars.API_URL || 'https://amtza-api.onrender.com' }}
